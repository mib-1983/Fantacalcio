<!DOCTYPE html>
<html lang="it">


<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asta</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>



<body>



<div class="container">



<h1>⚙️ Asta</h1>



<h2>Impostazioni asta</h2>


<div class="riquadroMercatoRiparazione">


<label style="color:  #1976D2; font-weight: bold; display: block; font-size: 18px;">
    Seleziona il file con la lista calciatori
</label>

<div style="
    display:flex;
    align-items:stretch;
    gap:10px;
    height:40px;
">

    <!-- SINISTRA -->
    <div style="
        display:flex;
        flex-direction:column;
        gap:5px;
        flex:1;
    ">

        <input
            type="file"
            id="fileRiparazione"
            accept=".xlsx,.xls"
            style="
                height:30px;
                box-sizing:border-box;
                padding:5px;
                font-size:14px;
            "
        >

        <div style="
            display:flex;
            align-items:center;
            gap:5px;
            height:35px;
        ">

        </div>

    </div>

</div>

</div>


<!-- ========================================= -->
<!-- RUOLO DA CUI INIZIARE -->
<!-- ========================================= -->


<label style="color:  #1976D2; font-weight: bold; display: block; font-size: 18px;">
    Ruolo da cui iniziare
</label>

<select id="ruolo">

    <option value="Portieri">
        Portieri
    </option>

    <option value="Difensori">
        Difensori
    </option>

    <option value="Centrocampisti">
        Centrocampisti
    </option>

    <option value="Attaccanti">
        Attaccanti
    </option>

</select>


<div class="riquadroMercatoRiparazione">
    <!-- ========================================= -->
    <!-- MODALITÀ ASTA -->
    <!-- ========================================= -->

    <label style="color:  #1976D2; font-weight: bold; display: block; font-size: 18px;">
        Modalità asta
    </label>

    <div class="scelta">


        <label>

            <input
                type="radio"
                name="modalita"
                value="alfabetico">
                
            Ordine alfabetico

        </label>



        <label>

            <input
                type="radio"
                name="modalita"
                value="casuale">
                
            Ordine casuale

        </label>



        <label>

            <input
                type="radio"
                name="modalita"
                value="lettera">

            Alfabetico da lettera scelta

        </label>






    <!-- ========================================= -->
    <!-- LETTERA -->
    <!-- ========================================= -->

    <div
        id="sceltaLettera"
        style="display:none;">


        <label>
            Lettera iniziale
        </label>


        <input
            id="lettera"
            type="text"
            maxlength="1"
            placeholder="A">


    </div>

</div>

</div>

 <div>



<div style="
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    margin-bottom: 20px
">

    <label
        for="creditiRiparazione"
        style= font-weight:bold; font-size:12px>

        Inserisci i crediti da aggiungere<br>per il mercato di riparazione:
    </label>

    <input
        id="creditiRiparazione"
        type="number"
        min="0"
        value="0"
        placeholder="0"
        style="
            width:90px;
            height:50px;
            padding:5px;
            margin:0;
            font-size:20px;
        "
    >

</div>


<div style="
    display: flex;
    gap: 50px;
    align-items: stretch;
    height:80px;
    margin:0;
    padding:5px;

">

<button 
    onclick="caricaGiocatoriRiparazione()" 
    style="
        background-color: orange;
        color: black;
        font-size:15px;
    "
    >
    💾 SALVA IMPOSTAZIONI ASTA
</button>
    
<button 
    id="btnIniziaAsta"
    onclick="iniziaAsta()"
    style="
        background-color: #388E3C;
        color: white;
        font-size:20px;
    "
    >
    🔨 INIZIA ASTA
</button>

</div>

</div>

<script>


// =========================================
// MOSTRA / NASCONDE LETTERA
// =========================================


let radio =
    document.querySelectorAll(
        'input[name="modalita"]'
    );


radio.forEach(r => {


    r.addEventListener(
        "change",
        function(){


            if(this.value == "lettera"){

                document.getElementById(
                    "sceltaLettera"
                ).style.display = "block";

            }
            else{

                document.getElementById(
                    "sceltaLettera"
                ).style.display = "none";

            }

        }
    );


});


document
    .getElementById("fileRiparazione")
    .addEventListener("click", function () {

        // Sblocca modalità asta
        document
            .querySelectorAll('input[name="modalita"]')
            .forEach(radio => {

                radio.disabled = false;

            });


        // Sblocca la lettera
        const lettera =
            document.getElementById("lettera");

        if (lettera) {

            lettera.disabled = false;

        }


        // Sblocca il ruolo
        const ruolo =
            document.getElementById("ruolo");

        if (ruolo) {

            ruolo.disabled = false;

        }

    });

</script>



<script src="app.js"></script>



<script>

caricaImpostazioniAsta();

aggiornaRuoliAsta();

</script>

<script src="menu.js"></script>


</body>


</html>
