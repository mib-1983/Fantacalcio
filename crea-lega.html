<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crea Lega</title>

<link rel="stylesheet" href="style.css">

<style>
.menu-navigazione,
.barra-fondo {
    display: none;
}
</style>

</head>


<body>


<div class="container">


<h1>🏆 Crea Lega</h1>


<div class="rigaCampo">
    <label>Nome lega</label>
    <input 
        type="text" 
        id="nomeLega"
        placeholder="Es. Fantacalcio 2026">
</div>

<div class="rigaCampo">
    <label>Crediti iniziali</label>
    <input 
        type="number" 
        id="crediti"
        value="500">
</div>

<div class="rigaCampo">
    <label>Numero partecipanti</label>
    <input 
        type="number" 
        id="numeroPartecipanti"
        value=""
        min="2"
        max="20"
        onchange="creaPartecipanti()">
</div>

<h2>Partecipanti</h2>

<div id="listaPartecipanti"></div>


<h2>Composizione rosa</h2>


<div class="rigaCampo">
    <label>🧤Portieri</label>
    <input 
        type="number"
        id="numeroPortieri"
        value="3">
</div>

<div class="rigaCampo">
    <label>🛡️Difensori</label>
    <input 
        type="number"
        id="numeroDifensori"
        value="8">
</div>

<div class="rigaCampo">
    <label>👟Centrocampisti</label>
    <input 
        type="number"
        id="numeroCentrocampisti"
        value="8">
</div>

<div class="rigaCampo">
    <label>⚽Attaccanti</label>
    <input 
        type="number"
        id="numeroAttaccanti"
        value="6">
</div>


<button onclick="salvaLega()">
    CREA LEGA
</button>


<button onclick="window.location.href='index.html'">
    INDIETRO
</button>



</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<script src="app.js"></script>


<script src="menu.js"></script>

</body>

</html>
